
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080e1c">
<title>AOGIRI | Entrada</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(145deg,#07101e,#102b4b);
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.card{
  width:100%;
  max-width:430px;
  padding:35px 25px;
  background:#101c34;
  border:1px solid #315887;
  border-radius:24px;
  text-align:center;
}
.logo{font-size:55px}
h1{letter-spacing:4px;font-size:32px}
p{color:#a9c2e3;line-height:1.6}
.botao{
  display:block;
  padding:17px;
  background:#5865f2;
  color:white;
  text-decoration:none;
  font-weight:bold;
  border-radius:12px;
  margin-top:25px;
}
.botao[hidden]{display:none}
#status{font-size:13px;margin-top:20px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">💀👑</div>
  <h1>AOGIRI</h1>
  <p>PORTAL OFICIAL DA FAMÍLIA</p>
  <p>Entre com sua conta Discord para acessar
  o portal e suas permissões.</p>

  <a class="botao"
     id="entrar"
     href="/.netlify/functions/auth-login">
    Entrar com Discord
  </a>

  <a class="botao"
     id="portal"
     href="/.netlify/functions/portal"
     hidden>
    Acessar meu portal
  </a>

  <p id="status">Verificando sua conexão...</p>
</main>

<script>
async function verificar() {
  const entrar = document.getElementById("entrar");
  const portal = document.getElementById("portal");
  const status = document.getElementById("status");

  entrar.hidden = true;
  portal.hidden = true;

  try {
    const resposta = await fetch(
      "/.netlify/functions/auth-me",
      { credentials:"same-origin", cache:"no-store" }
    );

    if (!resposta.ok) throw Error("Falha");

    const dados = await resposta.json();

    if (dados.authenticated) {
      portal.hidden = false;
      status.textContent =
        "Conectado como " + dados.nome;
    } else {
      entrar.hidden = false;
      status.textContent =
        "Login obrigatório para entrar.";
    }
  } catch {
    entrar.hidden = false;
    status.textContent =
      "Não foi possível verificar a sessão.";
  }
}

verificar();
</script>
</body>
</html>
